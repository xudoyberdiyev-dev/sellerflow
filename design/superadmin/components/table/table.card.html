(async () => {

const { useState } = React;

const names=['Dilnoza Karimova','Bekzod Tursunov','Madina Yusupova','Javohir Aliyev','Shahlo Nazarova','Otabek Ergashev','Nilufar Saidova','Sardor Qodirov','Gulnora Ismoilova','Rustam Xolmatov','Kamola Abdullayeva','Jasur Mirzayev'];

const rows=names.map((n,i)=>({id:i+1,name:n,tg:String(482019377+i*7310291).slice(0,9),status:st[i],channel:chs[i],calc:[214,96,3,41,180,12,77,0,133,58,1,92][i],last:['05.11.2026 14:32','05.11.2026 11:08','04.11.2026 19:47','28.10.2026 08:15','05.11.2026 09:51','01.11.2026 16:20','03.11.2026 12:02','12.09.2026 10:00','05.11.2026 13:13','02.11.2026 18:40','05.11.2026 08:05','04.11.2026 21:30'][i]}));

 {key:'name',header:'Sotuvchi',sortable:true,hideable:false,render:r=><div className="r" style={{gap:10,flexWrap:'nowrap'}}><Avatar name={r.name} size={28} /><div className="sf-cell-stack"><span>{r.name}</span><span className="sf-id" style={{fontSize:12}}>{r.tg}</span></div></div>},

 {key:'calc',header:'Hisoblashlar soni',sortable:true,align:'right'},
 {key:'profit',header:'Foyda',hideable:true,render:()=><Redacted label="Yashirin" />},
 {key:'last',header:'Oxirgi faollik',sortable:true},
