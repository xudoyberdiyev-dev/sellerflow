<!doctype html><html lang="uz"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg-surface)} .row{display:flex;gap:8px;flex-wrap:wrap} .sw{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1} .chip{height:48px;border-radius:6px;border:1px solid rgba(0,0,0,.06)} .lbl{font:var(--type-caption);color:var(--text-primary)} .hex{font:11px/14px var(--font-mono);color:var(--text-tertiary)} .g{display:grid;grid-template-columns:90px repeat(4,1fr);gap:6px;align-items:center} .c{height:30px;border-radius:4px;border:1px solid rgba(0,0,0,.06)}</style></head><body><div class="g"><span></span><span class="lbl">bg</span><span class="lbl">border</span><span class="lbl">text</span><span class="lbl">icon</span><span class="lbl">success</span><div class="c" style="background:var(--success-bg)"></div><div class="c" style="background:var(--success-border)"></div><div class="c" style="background:var(--success-text)"></div><div class="c" style="background:var(--success-icon)"></div><span class="lbl">warning</span><div class="c" style="background:var(--warning-bg)"></div><div class="c" style="background:var(--warning-border)"></div><div class="c" style="background:var(--warning-text)"></div><div class="c" style="background:var(--warning-icon)"></div><span class="lbl">danger</span><div class="c" style="background:var(--danger-bg)"></div><div class="c" style="background:var(--danger-border)"></div><div class="c" style="background:var(--danger-text)"></div><div class="c" style="background:var(--danger-icon)"></div><span class="lbl">info</span><div class="c" style="background:var(--info-bg)"></div><div class="c" style="background:var(--info-border)"></div><div class="c" style="background:var(--info-text)"></div><div class="c" style="background:var(--info-icon)"></div><span class="lbl">orange</span><div class="c" style="background:var(--orange-bg)"></div><div class="c" style="background:var(--orange-border)"></div><div class="c" style="background:var(--orange-text)"></div><div class="c" style="background:var(--orange-icon)"></div><span class="lbl">neutral</span><div class="c" style="background:var(--neutral-bg)"></div><div class="c" style="background:var(--neutral-border)"></div><div class="c" style="background:var(--neutral-text)"></div><div class="c" style="background:var(--neutral-icon)"></div></div></body></html>
