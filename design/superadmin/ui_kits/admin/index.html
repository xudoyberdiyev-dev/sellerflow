<script>
  // Default the preview to the logged-in dashboard; Tizimdan chiqish shows the login + 2FA flow.
  if (localStorage.getItem('sf-kit-authed') == null) localStorage.setItem('sf-kit-authed', '1');
  window.loadSellerFlowModules(['data.js', 'Shell.jsx', 'Login.jsx', 'Dashboard.jsx', 'Sellers.jsx', 'SellerDetail.jsx', 'AccessRequests.jsx', 'Admins.jsx', 'App.jsx'])
    .then(function (K) { ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(K.KitApp)); })
    .catch(function (e) { document.getElementById('root').textContent = 'Yuklashda xato: ' + e.message; console.error(e); });
