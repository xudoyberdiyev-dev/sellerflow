# Ixtiyoriy: sirlarni Docker secrets fayllaridan berish — ular `docker inspect` da ko'rinmaydi.
# Ishlatish:
#   mkdir -p secrets && chmod 700 secrets
#   printf '%s' 'BOT_TOKEN'   > secrets/TELEGRAM_BOT_TOKEN
#   openssl rand -base64 32 | tr -d '\n' > secrets/SELLERFLOW_SECRETS_KEY
#   chmod 600 secrets/*
#   .env dan TELEGRAM_BOT_TOKEN va SELLERFLOW_SECRETS_KEY qatorlarini O'CHIRING (bo'sh qoldiring)
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
# Ilova /run/secrets/<NOM> ni o'zi o'qiydi (SecretFilesEnvironmentPostProcessor). DB_PASSWORD hozircha .env da
# (Postgres faqat ichki tarmoqda, tashqariga ochilmagan).
services:
  app:
    secrets:
      - TELEGRAM_BOT_TOKEN
      - SELLERFLOW_SECRETS_KEY

secrets:
  TELEGRAM_BOT_TOKEN:
    file: ./secrets/TELEGRAM_BOT_TOKEN
  SELLERFLOW_SECRETS_KEY:
    file: ./secrets/SELLERFLOW_SECRETS_KEY
