services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sellerflow
      POSTGRES_USER: ${DB_USER:-sellerflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylida berilishi shart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sellerflow} -d sellerflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/sellerflow
      DB_USER: ${DB_USER:-sellerflow}
      DB_PASSWORD: ${DB_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN .env faylida berilishi shart}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_RECOVERY_EMAIL: ${ADMIN_RECOVERY_EMAIL:-}
      ADMIN_RECOVERY_PASSWORD: ${ADMIN_RECOVERY_PASSWORD:-}
      SUPPORT_LABEL: ${SUPPORT_LABEL:-}
      SUPPORT_URL: ${SUPPORT_URL:-}
      DELETION_PURGE_DATA: ${DELETION_PURGE_DATA:-false}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      # Backup holati (status.json) — faqat o'qish uchun
      - ./backups:/backups:ro
    healthcheck:
      # M-12: baza va Telegram poller (oxirgi muvaffaqiyatli so'rov < 120 s). Image'da curl yo'q — bash /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/container HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 90s
    ports:
      # Admin panel va API faqat serverning o'zidan ochiq. Tashqaridan kirish: SSH tunnel yoki HTTPS reverse proxy (docs/OPERATIONS.md)
      - "127.0.0.1:8080:8080"

  # Kunlik avtomatik backup: ./backups papkasiga. Rotatsiya faqat muvaffaqiyatli backupdan keyin,
  # eng yangi BACKUP_MIN_KEEP (7) nusxa doim saqlanadi; holat: ./backups/status.json
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-sellerflow}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: sellerflow
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_MIN_KEEP: ${BACKUP_MIN_KEEP:-7}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["bash", "/backup-loop.sh"]
    healthcheck:
      # Oxirgi muvaffaqiyatli backup 26 soatdan yangi bo'lishi shart (H-2)
      test: ["CMD-SHELL", "s=$$(sed -n 's/.*\"lastSuccessAt\": *\"\\([^\"]*\\)\".*/\\1/p' /backups/status.json); [ -n \"$$s\" ] && [ $$(( $$(date +%s) - $$(date -d \"$$s\" +%s) )) -lt 93600 ]"]
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 15m

volumes:
  pgdata:
