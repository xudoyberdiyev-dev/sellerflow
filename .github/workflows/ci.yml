name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sellerflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Admin UI build
        working-directory: admin-ui
        run: npm ci && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Backend tests
        env:
          SELLERFLOW_TEST_DB_URL: jdbc:postgresql://localhost:5432/sellerflow_test
          SELLERFLOW_TEST_DB_USER: postgres
          SELLERFLOW_TEST_DB_PASSWORD: postgres
        run: mvn -B verify
