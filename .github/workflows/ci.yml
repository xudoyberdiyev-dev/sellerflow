name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: .env.example faqat bo'sh qiymatlar bilan
        run: sh scripts/check-env-example.sh
      - name: gitleaks secret-scan
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          # 292cd7b gacha bo'lgan tarixda bekor qilingan (revoked) eski sirlar bor — ular ataylab skanerdan tashqarida.
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="292cd7b..HEAD" .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sellerflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Admin UI lint, build, audit
        working-directory: admin-ui
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Backup/restore skriptlari testi
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sellerflow_test
        run: |
          bash scripts/tests/backup-loop.test.sh
          bash scripts/tests/restore.test.sh
      - name: Backend tests
        env:
          SELLERFLOW_TEST_DB_URL: jdbc:postgresql://localhost:5432/sellerflow_test
          SELLERFLOW_TEST_DB_USER: postgres
          SELLERFLOW_TEST_DB_PASSWORD: postgres
        run: mvn -B verify

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/tests/*.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Docker image build
        run: docker build -t sellerflow:ci .
      - name: docker compose config
        env:
          TELEGRAM_BOT_TOKEN: ci-placeholder
          DB_PASSWORD: ci-placeholder
        run: docker compose --env-file /dev/null config -q

  dependency-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Yangilanishi kerak bo'lgan bog'liqliklar (hisobot, build'ni to'xtatmaydi)
        run: mvn -B -q versions:display-dependency-updates versions:display-plugin-updates -DprocessDependencyManagement=false -Dversions.outputFile=versions.txt -DoutputEncoding=UTF-8 || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-updates
          path: versions.txt
          if-no-files-found: ignore
