name: CI

on:
  push:
    branches: [main]
  pull_request:

# LOW (CI): minimal huquqlar; action'lar commit SHA bilan pinlangan (Dependabot yangilaydi)
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: .env.example faqat bo'sh qiymatlar bilan
        run: sh scripts/check-env-example.sh
      - name: gitleaks secret-scan
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -   # LOW: binar checksum bilan tekshiriladi
          tar xzf gitleaks.tgz gitleaks
          # 292cd7b gacha bo'lgan tarixda bekor qilingan (revoked) eski sirlar bor — ular ataylab skanerdan tashqarida.
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="292cd7b..HEAD" .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sellerflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Admin UI lint, build, audit
        working-directory: admin-ui
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Backup/restore skriptlari testi
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sellerflow_test
        run: |
          bash scripts/tests/backup-loop.test.sh
          bash scripts/tests/restore.test.sh
      - name: Backend tests
        env:
          SELLERFLOW_TEST_DB_URL: jdbc:postgresql://localhost:5432/sellerflow_test
          SELLERFLOW_TEST_DB_USER: postgres
          SELLERFLOW_TEST_DB_PASSWORD: postgres
        run: mvn -B verify

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/tests/*.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Docker image build
        run: docker build -t sellerflow:ci .
      - name: docker compose config
        env:
          TELEGRAM_BOT_TOKEN: ci-placeholder
          DB_PASSWORD: ci-placeholder
        run: docker compose --env-file /dev/null config -q

  # N-8: Java va npm bog'liqliklaridagi ma'lum zaifliklar (OSV bazasi) — topilsa build qizil
  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=pom.xml
            --lockfile=admin-ui/package-lock.json

  dependency-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Yangilanishi kerak bo'lgan bog'liqliklar (hisobot, build'ni to'xtatmaydi)
        run: mvn -B -q versions:display-dependency-updates versions:display-plugin-updates -DprocessDependencyManagement=false -Dversions.outputFile=versions.txt -DoutputEncoding=UTF-8 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-updates
          path: versions.txt
          if-no-files-found: ignore
