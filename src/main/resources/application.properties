spring.application.name=sellerflow

# ---- Baza ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sellerflow}
spring.datasource.username=${DB_USER:sellerflow}
spring.datasource.password=${DB_PASSWORD:sellerflow}
# LOW (DB): 4 ta bot worker + admin so'rovlari + rejalashtirilgan ishlar uchun yetarli; DB uzilsa tez xato
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.time-zone=UTC

# ---- Server ----
server.port=${PORT:8080}
# Reverse proxy (Caddy) ortida haqiqiy mijoz IP'si - faqat ichki (private) proxy'dan kelgan X-Forwarded-For ishoniladi.
server.forward-headers-strategy=native

# ---- Actuator ----
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# Docker healthcheck uchun (M-12): baza + bot. Backup holati bunga kirmaydi (konteyner sog'ligiga aloqasi yo'q).
management.endpoint.health.group.container.include=db,bot

# ---- Telegram ----
# Tokenni hech qachon repo yoki chatga yozmang - faqat muhit o'zgaruvchisi orqali.
sellerflow.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
sellerflow.telegram.api-base-url=${TELEGRAM_API_BASE_URL:https://api.telegram.org}
sellerflow.telegram.polling-enabled=${TELEGRAM_POLLING_ENABLED:true}
sellerflow.telegram.polling-timeout-seconds=30
# M-9: update'larni parallel qayta ishlovchi oqimlar (bitta foydalanuvchi doim bitta oqimda)
sellerflow.telegram.workers=${TELEGRAM_WORKERS:4}

# ---- Admin ----
# Faqat birorta ham admin bo'lmaganda birinchi SUPERADMIN yaratiladi (parol >= 12 belgi)
sellerflow.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
sellerflow.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
# Break-glass (M-7): ikkalasi berilsa, startupda shu email'li admin tiklanadi (docs/OPERATIONS.md 4C).
sellerflow.admin.recovery-email=${ADMIN_RECOVERY_EMAIL:}
sellerflow.admin.recovery-password=${ADMIN_RECOVERY_PASSWORD:}

# ---- Shartlar, qoralama, o'chirish ----
sellerflow.terms.version=${TERMS_VERSION:2026-11-05-v0.1}
sellerflow.draft.ttl-hours=24
sellerflow.deletion.grace-days=30
# Yuridik retention siyosati tasdiqlanguncha tijoriy ma'lumot o'chirilmaydi (faqat CLOSED + shaxsiy maydonlar tozalanadi)
sellerflow.deletion.purge-data=${DELETION_PURGE_DATA:false}

# ---- Backup monitoringi ----
# H-2: backup servisi yozadigan holat fayli (compose: ./backups -> /backups:ro)
sellerflow.backup.status-file=${BACKUP_STATUS_FILE:/backups/status.json}
sellerflow.backup.max-age-hours=26
# Ixtiyoriy: backup xatosi/eskirishi haqida shu Telegram chat'ga (bot orqali) ogohlantirish
sellerflow.backup.alert-chat-id=${ALERT_TELEGRAM_CHAT_ID:}
# N-2: production'da true (compose) - status.json bo'lmasa (grace'dan keyin) health DOWN + alert
sellerflow.backup.required=${BACKUP_REQUIRED:false}
sellerflow.backup.missing-grace-hours=${BACKUP_MISSING_GRACE_HOURS:2}

# ---- Audit, rate-limit, support ----
# LOW (DB): audit_events saqlash muddati (kun). Rozilik yozuvlari (consents) bunga kirmaydi.
sellerflow.audit.retention-days=${AUDIT_RETENTION_DAYS:365}
sellerflow.rate-limit.max-updates=20
sellerflow.rate-limit.window-seconds=10
# Ixtiyoriy boshlang'ich qiymat; admin API orqali o'zgartiriladi
sellerflow.support.default-label=${SUPPORT_LABEL:}
sellerflow.support.default-url=${SUPPORT_URL:}

# ---- Loglar ----
logging.level.root=INFO
logging.level.uz.sellerflow=INFO
