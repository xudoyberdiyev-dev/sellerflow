spring:
  application:
    name: sellerflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sellerflow}
    username: ${DB_USER:sellerflow}
    password: ${DB_PASSWORD:sellerflow}
    hikari:
      # LOW (DB): 4 ta bot worker + admin so'rovlari + rejalashtirilgan ishlar uchun yetarli; DB uzilsa tez xato
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1800000
      idle-timeout: 600000
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}
  # Reverse proxy (Caddy) ortida haqiqiy mijoz IP'si — faqat ichki (private) proxy'dan kelgan X-Forwarded-For ishoniladi.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # LOW: X-Forwarded-For faqat shu manbalardan qabul qilinadi (standart: localhost va Docker bridge 172.16/12).
      # Reverse proxy boshqa joyda bo'lsa — TRUSTED_PROXIES (Java regex) bilan aniq ko'rsating.
      internal-proxies: ${TRUSTED_PROXIES:127\.\d+\.\d+\.\d+|0:0:0:0:0:0:0:1|::1|172\.(1[6-9]|2[0-9]|3[0-1])\.\d+\.\d+}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      group:
        # Docker healthcheck uchun (M-12): baza + bot. Backup holati bunga kirmaydi (konteyner sog'ligiga aloqasi yo'q).
        container:
          include: db,bot

sellerflow:
  telegram:
    # Tokenni hech qachon repo yoki chatga yozmang — faqat muhit o'zgaruvchisi orqali.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
    polling-enabled: ${TELEGRAM_POLLING_ENABLED:true}
    polling-timeout-seconds: 30
    # M-9: update'larni parallel qayta ishlovchi oqimlar (bitta foydalanuvchi doim bitta oqimda)
    workers: ${TELEGRAM_WORKERS:4}
  admin:
    # Faqat birorta ham admin bo'lmaganda birinchi SUPERADMIN yaratiladi (parol >= 12 belgi)
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    # Break-glass (M-7): ikkalasi berilsa, startupda shu email'li admin tiklanadi (docs/OPERATIONS.md §4C).
    recovery-email: ${ADMIN_RECOVERY_EMAIL:}
    recovery-password: ${ADMIN_RECOVERY_PASSWORD:}
  terms:
    version: ${TERMS_VERSION:2026-11-05-v0.1}
  draft:
    ttl-hours: 24
  deletion:
    grace-days: 30
    # Yuridik retention siyosati tasdiqlanguncha tijoriy ma'lumot o'chirilmaydi (faqat CLOSED + shaxsiy maydonlar tozalanadi)
    purge-data: ${DELETION_PURGE_DATA:false}
    # N-11: ro'yxatdan o'tishni tugatmagan foydalanuvchi yozuvi shuncha kun faolliksiz bo'lsa psevdonimlanadi
    onboarding-retention-days: ${ONBOARDING_RETENTION_DAYS:30}
  backup:
    # H-2: backup servisi yozadigan holat fayli (compose: ./backups -> /backups:ro)
    status-file: ${BACKUP_STATUS_FILE:/backups/status.json}
    max-age-hours: 26
    # Ixtiyoriy: backup xatosi/eskirishi haqida shu Telegram chat'ga (bot orqali) ogohlantirish
    alert-chat-id: ${ALERT_TELEGRAM_CHAT_ID:}
    # N-2: production'da true (compose) — status.json bo'lmasa (grace'dan keyin) health DOWN + alert
    required: ${BACKUP_REQUIRED:false}
    missing-grace-hours: ${BACKUP_MISSING_GRACE_HOURS:2}
  audit:
    # LOW (DB): audit_events saqlash muddati (kun). Rozilik yozuvlari (consents) bunga kirmaydi.
    retention-days: ${AUDIT_RETENTION_DAYS:365}
  rate-limit:
    max-updates: 20
    window-seconds: 10
  support:
    # Ixtiyoriy boshlang'ich qiymat; admin API orqali o'zgartiriladi
    default-label: ${SUPPORT_LABEL:}
    default-url: ${SUPPORT_URL:}

logging:
  level:
    root: INFO
    uz.sellerflow: INFO
